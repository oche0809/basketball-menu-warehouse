# main に push すると、ビルドして GitHub Pages に公開する。
# 先生がアプリの「チームページに公開」を押したとき（repository_dispatch: team-board）も、
# team-board ブランチの予定（team-board.json）を入れて公開し直す
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  repository_dispatch:
    types: ['team-board']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # テストに失敗したら公開しない
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # チームページの予定。まだ一度も公開していなければ入れない（アプリは「まだありません」と表示する）
      - name: Add team board
        run: |
          if git fetch --depth=1 origin team-board; then
            git show FETCH_HEAD:team-board.json > dist/team-board.json
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
