# 毎週月曜の朝、参考動画がまだ見られるかを確認する。
# 見られない動画があれば Issue「参考動画のリンク切れ」を作る（すでにあればコメントを追加）。すべて見られるようになったら閉じる
name: Check reference videos

on:
  schedule:
    - cron: '0 0 * * 1' # 毎週月曜 9:00（日本時間）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check videos
        id: check
        run: node scripts/check-videos.mjs report.md

      - name: Report as issue
        env:
          GH_TOKEN: ${{ github.token }}
          BROKEN: ${{ steps.check.outputs.broken }}
        run: |
          TITLE="参考動画のリンク切れ"
          NUMBER=$(gh issue list --state open --search "in:title $TITLE" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          if [ "$BROKEN" != "0" ]; then
            if [ -n "$NUMBER" ]; then
              gh issue comment "$NUMBER" --body-file report.md
            else
              gh issue create --title "$TITLE" --body-file report.md
            fi
          elif [ -n "$NUMBER" ]; then
            gh issue close "$NUMBER" --comment "すべての参考動画が見られるようになったので閉じます。"
          fi
